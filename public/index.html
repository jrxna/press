<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Press</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="site-title">Press</a>
    </div>
  </header>

  <main class="container">
    <section class="post-grid">

      <article class="card">
        <a href="#" class="card-thumbnail-link">
          <div class="card-thumbnail">
            <img src="/images/post1.jpg" alt="My First Post" />
          </div>
        </a>
        <div class="card-body">
          <time class="card-date">March 29, 2026</time>
          <h2 class="card-title"><a href="#">My First Post</a></h2>
          <p class="card-description">My first test post</p>
        </div>
      </article>

      <article class="card">
        <a href="#" class="card-thumbnail-link">
          <div class="card-thumbnail">
            <img src="/images/post2.jpg" alt="My Second Post" />
          </div>
        </a>
        <div class="card-body">
          <time class="card-date">March 29, 2026</time>
          <h2 class="card-title"><a href="#">My Second Post</a></h2>
          <p class="card-description">Another test post</p>
        </div>
      </article>

      <article class="card">
        <a href="#" class="card-thumbnail-link">
          <div class="card-thumbnail">
            <img src="/images/post3.jpg" alt="A Third Post" />
          </div>
        </a>
        <div class="card-body">
          <time class="card-date">April 1, 2026</time>
          <h2 class="card-title"><a href="#">A Third Post</a></h2>
          <p class="card-description">A third example post to fill the row</p>
        </div>
      </article>

    </section>
  </main>
</body>
</html>
